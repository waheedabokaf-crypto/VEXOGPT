
name: Build VEXOGPT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o VEXOGPT_GitHub_Upload_FIXED.zip -d project
          ls -la project
          test -f project/android/app/build.gradle.kts

      - name: Build APK
        working-directory: project/android
        run: |
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VEXOGPT-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
